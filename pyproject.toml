[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elyrion-frequency-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2", "numpy==2.2.6", "scipy==1.15.3", "pandas==2.2.3", "duckdb==1.2.2", "pyarrow==19.0.1", "pyserial==3.5"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
